name: Android release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, matching app versionName (for example v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.package.outputs.version }}
      apk: ${{ steps.package.outputs.release_file }}
      sha256: ${{ steps.package.outputs.release_sha256 }}
      commit: ${{ steps.package.outputs.commit }}
    steps:
      - name: Check tag and signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import re
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z][0-9A-Za-z.-]*)?", os.environ["RELEASE_TAG"]):
              raise SystemExit("Use an existing vMAJOR.MINOR.PATCH tag, optionally with a prerelease suffix.")
          names = ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Configure repository Actions Secrets before releasing: " + ", ".join(missing))
          PY
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json url >/dev/null 2>&1; then
            printf 'A release already exists for %s; use a new version tag.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Check source version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          source = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          matches = re.findall(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', source, re.MULTILINE)
          if len(matches) != 1 or os.environ["RELEASE_TAG"] != "v" + matches[0]:
              raise SystemExit("The release tag must match app/build.gradle.kts versionName.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Restore distribution signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path
          try:
              data = base64.b64decode("".join(os.environ["ANDROID_KEYSTORE_BASE64"].split()), validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit("ANDROID_KEYSTORE_BASE64 must contain a base64-encoded keystore.")
          if not data:
              raise SystemExit("The signing keystore is empty.")
          path = Path(os.environ["RUNNER_TEMP"]) / "street-snap-signing.keystore"
          path.touch(mode=0o600, exist_ok=False)
          path.write_bytes(data)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"ANDROID_KEYSTORE_PATH={path}\n")
          PY
      - name: Build and verify signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :camera:testDebugUnitTest :color:testDebugUnitTest --no-daemon --no-configuration-cache
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Prepare release APK and checksum
        id: package
        run: python3 .github/scripts/package-apks.py release --tag "$RELEASE_TAG"
      - name: Upload verified release package
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/street-snap-signing.keystore"

  draft:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      APP_VERSION: ${{ needs.package.outputs.version }}
      APK_NAME: ${{ needs.package.outputs.apk }}
      APK_SHA256: ${{ needs.package.outputs.sha256 }}
      SOURCE_COMMIT: ${{ needs.package.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-apk
          path: release-assets
      - name: Create draft release
        run: |
          if gh release view "$RELEASE_TAG" --json url >/dev/null 2>&1; then
            printf 'A release already exists for %s; this workflow will not overwrite it.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          {
            printf 'Android %s · Android 12+\n\n' "$APP_VERSION"
            printf 'Built from tag `%s` (commit `%s`). This APK is signed with the repository maintainer’s configured distribution key.\n\n' "$RELEASE_TAG" "$SOURCE_COMMIT"
            printf 'Download `%s`; `SHA256SUMS` is included for verification.\n\n' "$APK_NAME"
            printf 'SHA-256: `%s`\n\n' "$APK_SHA256"
            printf 'This is a draft. Review the APK, signing compatibility and release notes before publishing.\n'
          } > release-notes.md
          release_flags=(--verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$APP_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "release-assets/$APK_NAME" release-assets/SHA256SUMS "${release_flags[@]}"
          release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          printf '## Draft release ready\n\n[Review %s](%s)\n\nThe release remains a draft until a maintainer publishes it.\n' "$RELEASE_TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"
